name: Update Golden Trial

on:
  schedule:
    - cron: '5 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-golden-trial
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run update:gold-trial
      - run: npm run build

      - name: Commit updated activity
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/goldTrial.js dist
          git diff --cached --quiet && exit 0
          git commit -m "Update Golden Trial"
          git push
